<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>We. Concierge</title>
  <meta name="description" content="Workflows and mini apps built for the We. Communications Singapore team.">
  <link rel="icon" type="image/png" href="assets/logo-positive.png">
  <link rel="preload" href="fonts/LeagueGothic-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>
<body>
<div class="page">

  <header class="site-header">
    <div class="site-header__brand">
      <img class="site-header__logo" src="assets/logo-positive.png" alt="We. Communications" width="48" height="48">
      <div class="site-header__name">Concierge</div>
    </div>
    <time class="site-header__date" id="today"></time>
  </header>

  <section class="hero" aria-labelledby="hero-title">
    <div class="we-wash">
      <div class="we-grain"></div>
      <h1 class="hero__title" id="hero-title">WORKFLOWS &amp; APPS TO HELP YOU SAVE TIME</h1>
    </div>
  </section>

  <main class="main">
    <h2 class="visually-hidden">Mini apps</h2>
    <ul class="apps" id="apps"></ul>
  </main>

  <footer class="site-footer">
    <span>Copyright <span id="year">2026</span> · We. Communications · All rights reserved</span>
  </footer>

</div>
</body>
</html>
